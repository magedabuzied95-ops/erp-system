<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=m1-mark-20260716" />
    <link rel="preconnect" href="https://api.m1store-egy.com" crossorigin />
    <link rel="dns-prefetch" href="//api.m1store-egy.com" />
    <meta name="theme-color" content="#eae7e0" />
    <meta name="application-name" content="M1 Store" />
    <meta name="description" content="M1 Store للأحذية والشنط والكروكس والسليبر للرجال والنساء والأطفال." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M1 Store" />
    <meta property="og:title" content="M1 Store" />
    <meta property="og:description" content="تسوق أحدث الأحذية والشنط والكروكس والسليبر من M1 Store." />
    <meta property="og:url" content="https://m1store-egy.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="M1 Store" />
    <meta name="twitter:description" content="تسوق أحدث الأحذية والشنط والكروكس والسليبر من M1 Store." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="M1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=m1-mark-20260716" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var host = String(window.location.hostname || "").toLowerCase();
          var path = String(window.location.pathname || "/").toLowerCase();
          var isPortalPath = /^\/(employee|employee-app|employee-portal|manager|manager-portal|pos|inbox)(\/|$)/.test(path);
          var isStorefrontHost = host === "m1store-egy.com" || host === "www.m1store-egy.com" || (host.endsWith(".vercel.app") && !isPortalPath);
          // The public storefront has one fixed brand theme on every browser.
          // ERP users can still keep their private workspace preference.
          var storedTheme = isStorefrontHost ? "dark" : localStorage.getItem("erp.theme");
          try {
            storedTheme = JSON.parse(storedTheme);
          } catch (parseError) {
            // Older ERP theme values were stored as plain strings.
          }
          var theme = storedTheme === "dark" ? "dark" : "light";
          var dark = theme === "dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.themeSource = isStorefrontHost ? "storefront" : "erp";
          root.classList.toggle("dark", dark);
          root.style.colorScheme = theme;
          // Anti-FOUC seeds. These MUST track src/theme/themes.js: they paint
          // before React mounts, and ThemeProvider then rewrites the same custom
          // properties with the real theme.
          root.style.setProperty("--bg", dark ? "#131211" : "#eae7e0");
          root.style.setProperty("--surface", dark ? "#1d1c1a" : "#ffffff");
          root.style.setProperty("--card", dark ? "#232220" : "#ffffff");
          root.style.setProperty("--surface-soft", dark ? "#191817" : "#f4f1ea");
          root.style.setProperty("--text", dark ? "#f3f1ec" : "#1b1915");
          root.style.setProperty("--muted", dark ? "#a8a399" : "#6a665e");
          root.style.setProperty("--border", dark ? "#33312d" : "#d5cfc2");
          // Track the token instead of freezing a literal. A literal here becomes
          // an INLINE background on <html>, which outranks every stylesheet rule
          // and which ThemeProvider never clears — that is why the canvas kept
          // painting the pre-refresh #f3f3f1 long after the theme changed.
          root.style.background = "var(--bg)";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#131211" : "#eae7e0");
        } catch (error) {
          document.documentElement.style.background = "var(--bg, #eae7e0)";
        }
      })();
    </script>
    <style>
      html,body,#root{min-height:100%;background:var(--bg,#eae7e0);color:var(--text,#1b1915)}
      body{margin:0}
    </style>
    <script>
      (function () {
        try {
          var path = window.location.pathname || "/";
          var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
          var lastEmployeePortalUrl = window.localStorage && window.localStorage.getItem("employee_portal_last_url");
          var lastManagerPortalUrl = window.localStorage && window.localStorage.getItem("manager_portal_last_url");
          var lastAiInboxUrl = window.localStorage && window.localStorage.getItem("ai_inbox_last_url");
          var lastPortalUrl = (window.localStorage && window.localStorage.getItem("portal_last_url")) || lastManagerPortalUrl || lastEmployeePortalUrl;
          var inboxMatch = path === "/inbox" || path.indexOf("/inbox/") === 0;
          if (standalone && (path === "/" || path === "/login") && lastAiInboxUrl) {
            window.location.replace(lastAiInboxUrl);
            return;
          }
          if (standalone && (path === "/" || path === "/login") && lastPortalUrl) {
            lastPortalUrl = lastPortalUrl.replace("/employee-portal/", "/employee-app/");
            window.location.replace(lastPortalUrl);
            return;
          }
          var existingManifests = Array.prototype.slice.call(document.querySelectorAll('link[rel="manifest"]'));
          existingManifests.forEach(function (item) {
            item.parentNode && item.parentNode.removeChild(item);
          });
          var manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          var employeeMatch = path.match(/^\/employee-(?:portal|app)\/([^/?#]+)/);
          var managerMatch = path.match(/^\/manager-portal\/([^/?#]+)/);
          var posMatch = path === "/pos" || path.indexOf("/pos/") === 0;
          var manifestHref = "/manifest.webmanifest?v=global";
          if (inboxMatch) {
            manifestHref = "/inbox-manifest.webmanifest?v=3";
            if (window.localStorage) {
              var inboxUrl = path + window.location.search;
              window.localStorage.setItem("ai_inbox_last_url", inboxUrl);
              window.localStorage.setItem("portal_last_url", inboxUrl);
            }
          } else if (employeeMatch) {
            var token = employeeMatch[1];
            manifestHref = "/api/employee-portal/" + encodeURIComponent(token) + "/manifest.webmanifest?v=" + encodeURIComponent(token);
            if (window.localStorage) {
              var employeeUrl = "/employee-app/" + encodeURIComponent(token) + window.location.search;
              window.localStorage.setItem("employee_portal_last_url", employeeUrl);
              window.localStorage.setItem("portal_last_url", employeeUrl);
            }
          } else if (managerMatch) {
            var managerToken = managerMatch[1];
            manifestHref = "/api/manager-portal/" + encodeURIComponent(managerToken) + "/manifest.webmanifest?v=" + encodeURIComponent(managerToken);
            if (window.localStorage) {
              var managerUrl = "/manager-portal/" + encodeURIComponent(managerToken) + window.location.search;
              window.localStorage.setItem("manager_portal_last_url", managerUrl);
              window.localStorage.setItem("portal_last_url", managerUrl);
            }
          } else if (posMatch) {
            manifestHref = "/pos-manifest.webmanifest?v=10";
          }
          manifest.setAttribute("href", manifestHref);
          document.head.appendChild(manifest);
          if (!employeeMatch && !managerMatch && !posMatch && !inboxMatch) return;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]') || document.createElement("meta");
          appleTitle.setAttribute("name", "apple-mobile-web-app-title");
          appleTitle.setAttribute("content", "M1");
          if (managerMatch) appleTitle.setAttribute("content", "Manager");
          if (posMatch) appleTitle.setAttribute("content", "POS");
          if (inboxMatch) appleTitle.setAttribute("content", "AI Inbox");
          if (!appleTitle.parentNode) document.head.appendChild(appleTitle);
          if (posMatch) {
            var posTheme = document.querySelector('meta[name="theme-color"]') || document.createElement("meta");
            posTheme.setAttribute("name", "theme-color");
            posTheme.setAttribute("content", "#07111f");
            if (!posTheme.parentNode) document.head.appendChild(posTheme);

            var posTouchIcon = document.querySelector('link[rel="apple-touch-icon"]') || document.createElement("link");
            posTouchIcon.setAttribute("rel", "apple-touch-icon");
            posTouchIcon.setAttribute("href", "/icons/pos-180.png?v=10");
            if (!posTouchIcon.parentNode) document.head.appendChild(posTouchIcon);

            if ("serviceWorker" in navigator) {
              window.addEventListener("load", function () {
                navigator.serviceWorker.register("/pos-sw.js?v=10", { scope: "/pos" }).then(function (registration) {
                  if (registration && registration.update) registration.update().catch(function () {});
                }).catch(function () {});
              }, { once: true });
            }
          }
        } catch (error) {
          // PWA fallback must never block app startup.
        }
      })();
    </script>
    <title>M1 Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
