<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="الموظف" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var path = window.location.pathname || "/";
          var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
          var lastEmployeePortalUrl = window.localStorage && window.localStorage.getItem("employee_portal_last_url");
          var lastManagerPortalUrl = window.localStorage && window.localStorage.getItem("manager_portal_last_url");
          var lastPortalUrl = (window.localStorage && window.localStorage.getItem("portal_last_url")) || lastManagerPortalUrl || lastEmployeePortalUrl;
          if (standalone && (path === "/" || path === "/login") && lastPortalUrl) {
            lastPortalUrl = lastPortalUrl.replace("/employee-portal/", "/employee-app/");
            window.location.replace(lastPortalUrl);
            return;
          }
          var existingManifests = Array.prototype.slice.call(document.querySelectorAll('link[rel="manifest"]'));
          existingManifests.forEach(function (item) {
            item.parentNode && item.parentNode.removeChild(item);
          });
          var manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          var employeeMatch = path.match(/^\/employee-(?:portal|app)\/([^/?#]+)/);
          var managerMatch = path.match(/^\/manager-portal\/([^/?#]+)/);
          if (employeeMatch) {
            var token = employeeMatch[1];
            manifest.setAttribute("href", "/api/employee-portal/" + encodeURIComponent(token) + "/manifest.webmanifest?v=" + encodeURIComponent(token));
            if (window.localStorage) {
              var employeeUrl = "/employee-app/" + encodeURIComponent(token) + window.location.search;
              window.localStorage.setItem("employee_portal_last_url", employeeUrl);
              window.localStorage.setItem("portal_last_url", employeeUrl);
            }
          } else if (managerMatch) {
            var managerToken = managerMatch[1];
            manifest.setAttribute("href", "/api/manager-portal/" + encodeURIComponent(managerToken) + "/manifest.webmanifest?v=" + encodeURIComponent(managerToken));
            if (window.localStorage) {
              var managerUrl = "/manager-portal/" + encodeURIComponent(managerToken) + window.location.search;
              window.localStorage.setItem("manager_portal_last_url", managerUrl);
              window.localStorage.setItem("portal_last_url", managerUrl);
            }
          } else {
            manifest.setAttribute("href", "/manifest.webmanifest?v=global");
          }
          document.head.appendChild(manifest);
          if (!employeeMatch && !managerMatch) return;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]') || document.createElement("meta");
          appleTitle.setAttribute("name", "apple-mobile-web-app-title");
          appleTitle.setAttribute("content", "الموظف");
          if (managerMatch) appleTitle.setAttribute("content", "Manager");
          if (!appleTitle.parentNode) document.head.appendChild(appleTitle);
        } catch (error) {
          // PWA fallback must never block app startup.
        }
      })();
    </script>
    <title>M1 Employee Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
