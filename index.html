<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=m1-mark-20260716" />
    <link rel="preconnect" href="https://api.m1store-egy.com" crossorigin />
    <link rel="dns-prefetch" href="//api.m1store-egy.com" />
    <meta name="theme-color" content="#eae7e0" />
    <meta name="application-name" content="M1 Store" />
    <meta name="description" content="M1 Store للأحذية والشنط والكروكس والسليبر للرجال والنساء والأطفال." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M1 Store" />
    <meta property="og:title" content="M1 Store" />
    <meta property="og:description" content="تسوق أحدث الأحذية والشنط والكروكس والسليبر من M1 Store." />
    <meta property="og:url" content="https://m1store-egy.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="M1 Store" />
    <meta name="twitter:description" content="تسوق أحدث الأحذية والشنط والكروكس والسليبر من M1 Store." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="M1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=m1-mark-20260716" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var host = String(window.location.hostname || "").toLowerCase();
          var path = String(window.location.pathname || "/").toLowerCase();
          var isPortalPath = /^\/(employee|employee-app|employee-portal|manager|manager-portal|pos|inbox)(\/|$)/.test(path);
          var isStorefrontHost = host === "m1store-egy.com" || host === "www.m1store-egy.com" || (host.endsWith(".vercel.app") && !isPortalPath);
          // The public storefront has one fixed brand theme on every browser.
          // ERP users can still keep their private workspace preference.
          var storedTheme = isStorefrontHost ? "dark" : localStorage.getItem("erp.theme");
          try {
            storedTheme = JSON.parse(storedTheme);
          } catch (parseError) {
            // Older ERP theme values were stored as plain strings.
          }
          var theme = storedTheme === "dark" ? "dark" : "light";
          var dark = theme === "dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.themeSource = isStorefrontHost ? "storefront" : "erp";
          root.classList.toggle("dark", dark);
          root.style.colorScheme = theme;
          // Anti-FOUC seeds. These MUST track src/theme/themes.js: they paint
          // before React mounts, and ThemeProvider then rewrites the same custom
          // properties with the real theme.
          root.style.setProperty("--bg", dark ? "#131211" : "#eae7e0");
          root.style.setProperty("--surface", dark ? "#1d1c1a" : "#ffffff");
          root.style.setProperty("--card", dark ? "#232220" : "#ffffff");
          root.style.setProperty("--surface-soft", dark ? "#191817" : "#f4f1ea");
          root.style.setProperty("--text", dark ? "#f3f1ec" : "#1b1915");
          root.style.setProperty("--muted", dark ? "#a8a399" : "#6a665e");
          root.style.setProperty("--border", dark ? "#33312d" : "#ded8cb");
          // Track the token instead of freezing a literal. A literal here becomes
          // an INLINE background on <html>, which outranks every stylesheet rule
          // and which ThemeProvider never clears — that is why the canvas kept
          // painting the pre-refresh #f3f3f1 long after the theme changed.
          root.style.background = "var(--bg)";
          // Appearance seed (fonts). src/theme/appearanceStore.js stores the
          // resolved CSS stacks and Google Fonts URLs next to the profile so
          // this script can apply them without knowing the font catalogue.
          if (!isStorefrontHost) {
            try {
              var storedAppearance = JSON.parse(localStorage.getItem("erp.appearance") || "null");
              var resolved = storedAppearance && storedAppearance.resolved;
              if (resolved && typeof resolved.fontAr === "string" && typeof resolved.fontEn === "string") {
                root.style.setProperty("--font-ar", resolved.fontAr);
                root.style.setProperty("--font-en", resolved.fontEn);
                (resolved.links || []).forEach(function (href) {
                  if (typeof href !== "string" || href.indexOf("https://fonts.googleapis.com/") !== 0) return;
                  var link = document.createElement("link");
                  link.rel = "stylesheet";
                  link.href = href;
                  link.setAttribute("data-erp-font-seed", "1");
                  document.head.appendChild(link);
                });
              }
            } catch (appearanceError) {
              // A malformed record must never block boot; the provider re-applies.
            }
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#131211" : "#eae7e0");
        } catch (error) {
          document.documentElement.style.background = "var(--bg, #eae7e0)";
        }
      })();
    </script>
    <style>
      html,body,#root{min-height:100%;background:var(--bg,#eae7e0);color:var(--text,#1b1915)}
      body{margin:0}
    </style>
    <script>
      // ===================================================================
      // BOOT PREFETCH: PRODUCT DETAILS
      // -------------------------------------------------------------------
      // The product request used to be issued by StorefrontProductDetailPage,
      // which cannot run until the entry chunk, App, the Storefront bundle and
      // the page chunk have all downloaded and executed. On a real connection
      // that put the request ~3.9s into the navigation even though the API
      // answers in ~400ms, and the product images -- the LCP element -- could
      // not start until after it returned.
      //
      // Issuing it here costs nothing on the critical path (the document is
      // already parsed) and the response is sitting in memory by the time React
      // mounts, so the gallery starts loading the moment the page renders.
      //
      // Deliberately conservative: production storefront host only, anonymous
      // visitors only. A signed-in ERP user sends an x-tenant-id header that
      // this script does not reproduce, and the endpoint varies on it -- so for
      // those the page falls back to its normal request path.
      // ===================================================================
      (function () {
        try {
          var host = String(window.location.hostname || "").toLowerCase();
          if (host !== "m1store-egy.com" && host !== "www.m1store-egy.com") return;

          var match = String(window.location.pathname || "").match(/^\/(?:shop\/)?product\/([^/?#]+)\/?$/i);
          if (!match) return;
          var identifier = decodeURIComponent(match[1] || "");
          if (!identifier) return;

          // Mirrors the header logic in src/shared/api/api.js: a tenant id only
          // exists for a signed-in user, and an anonymous shopper sends none.
          var hasTenantScope = false;
          try {
            hasTenantScope = Boolean(localStorage.getItem("user") || localStorage.getItem("tenant"));
          } catch (storageError) {
            hasTenantScope = true; // cannot prove it is anonymous, so do not guess
          }
          if (hasTenantScope) return;

          var url = "https://api.m1store-egy.com/api/storefront/products/" + encodeURIComponent(identifier);
          window.__M1_BOOT_PRODUCT = {
            key: identifier,
            at: Date.now(),
            promise: fetch(url, { credentials: "omit", headers: { Accept: "application/json" } }).then(function (response) {
              if (!response.ok) throw new Error("boot_prefetch_status_" + response.status);
              return response.json();
            }),
          };
          // An unconsumed rejection here must not surface as an unhandled error;
          // the page's own request path is the fallback and reports properly.
          window.__M1_BOOT_PRODUCT.promise.catch(function () {});
        } catch (error) {
          // The prefetch is an optimisation. Never let it block boot.
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var path = window.location.pathname || "/";
          var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
          var lastEmployeePortalUrl = window.localStorage && window.localStorage.getItem("employee_portal_last_url");
          var lastManagerPortalUrl = window.localStorage && window.localStorage.getItem("manager_portal_last_url");
          var lastAiInboxUrl = window.localStorage && window.localStorage.getItem("ai_inbox_last_url");
          var lastPortalUrl = (window.localStorage && window.localStorage.getItem("portal_last_url")) || lastManagerPortalUrl || lastEmployeePortalUrl;
          var inboxMatch = path === "/inbox" || path.indexOf("/inbox/") === 0;
          if (standalone && (path === "/" || path === "/login") && lastAiInboxUrl) {
            window.location.replace(lastAiInboxUrl);
            return;
          }
          if (standalone && (path === "/" || path === "/login") && lastPortalUrl) {
            lastPortalUrl = lastPortalUrl.replace("/employee-portal/", "/employee-app/");
            window.location.replace(lastPortalUrl);
            return;
          }
          var existingManifests = Array.prototype.slice.call(document.querySelectorAll('link[rel="manifest"]'));
          existingManifests.forEach(function (item) {
            item.parentNode && item.parentNode.removeChild(item);
          });
          var manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          var employeeMatch = path.match(/^\/employee-(?:portal|app)\/([^/?#]+)/);
          var managerMatch = path.match(/^\/manager-portal\/([^/?#]+)/);
          var posMatch = path === "/pos" || path.indexOf("/pos/") === 0;
          var manifestHref = "/manifest.webmanifest?v=global";
          if (inboxMatch) {
            manifestHref = "/inbox-manifest.webmanifest?v=3";
            if (window.localStorage) {
              var inboxUrl = path + window.location.search;
              window.localStorage.setItem("ai_inbox_last_url", inboxUrl);
              window.localStorage.setItem("portal_last_url", inboxUrl);
            }
          } else if (employeeMatch) {
            var token = employeeMatch[1];
            manifestHref = "/api/employee-portal/" + encodeURIComponent(token) + "/manifest.webmanifest?v=" + encodeURIComponent(token);
            if (window.localStorage) {
              var employeeUrl = "/employee-app/" + encodeURIComponent(token) + window.location.search;
              window.localStorage.setItem("employee_portal_last_url", employeeUrl);
              window.localStorage.setItem("portal_last_url", employeeUrl);
            }
          } else if (managerMatch) {
            var managerToken = managerMatch[1];
            manifestHref = "/api/manager-portal/" + encodeURIComponent(managerToken) + "/manifest.webmanifest?v=" + encodeURIComponent(managerToken);
            if (window.localStorage) {
              var managerUrl = "/manager-portal/" + encodeURIComponent(managerToken) + window.location.search;
              window.localStorage.setItem("manager_portal_last_url", managerUrl);
              window.localStorage.setItem("portal_last_url", managerUrl);
            }
          } else if (posMatch) {
            manifestHref = "/pos-manifest.webmanifest?v=10";
          }
          manifest.setAttribute("href", manifestHref);
          document.head.appendChild(manifest);
          if (!employeeMatch && !managerMatch && !posMatch && !inboxMatch) return;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]') || document.createElement("meta");
          appleTitle.setAttribute("name", "apple-mobile-web-app-title");
          appleTitle.setAttribute("content", "M1");
          if (managerMatch) appleTitle.setAttribute("content", "Manager");
          if (posMatch) appleTitle.setAttribute("content", "POS");
          if (inboxMatch) appleTitle.setAttribute("content", "AI Inbox");
          if (!appleTitle.parentNode) document.head.appendChild(appleTitle);
          if (posMatch) {
            var posTheme = document.querySelector('meta[name="theme-color"]') || document.createElement("meta");
            posTheme.setAttribute("name", "theme-color");
            posTheme.setAttribute("content", "#07111f");
            if (!posTheme.parentNode) document.head.appendChild(posTheme);

            var posTouchIcon = document.querySelector('link[rel="apple-touch-icon"]') || document.createElement("link");
            posTouchIcon.setAttribute("rel", "apple-touch-icon");
            posTouchIcon.setAttribute("href", "/icons/pos-180.png?v=10");
            if (!posTouchIcon.parentNode) document.head.appendChild(posTouchIcon);

            if ("serviceWorker" in navigator) {
              window.addEventListener("load", function () {
                navigator.serviceWorker.register("/pos-sw.js?v=11", { scope: "/pos" }).then(function (registration) {
                  if (registration && registration.update) registration.update().catch(function () {});
                }).catch(function () {});
              }, { once: true });
            }
          }
        } catch (error) {
          // PWA fallback must never block app startup.
        }
      })();
    </script>
    <script>
      // ===================================================================
      // BOOT-LEVEL STALE-BUILD RECOVERY
      // -------------------------------------------------------------------
      // src/shared/utils/chunkLoadRecovery.js already recovers from chunk
      // failures -- but it is imported by main.jsx, so it ships INSIDE the
      // entry bundle. When the failing asset IS the entry bundle, that module
      // never executes and nothing recovers: React never mounts and the
      // operator sees a permanently blank page. That is the exact shape of the
      // POS incident.
      //
      // This runs from the HTML document instead, so it survives the entry
      // chunk being missing. It shares the sessionStorage guard key with
      // chunkLoadRecovery so the two can never reload against each other, and
      // it attempts at most ONE recovery per guard window.
      // ===================================================================
      (function () {
        var GUARD_KEY = "erp.chunk-reload-attempted";
        var GUARD_MS = 5 * 60 * 1000;
        var recovering = false;

        function alreadyAttempted() {
          try {
            var value = sessionStorage.getItem(GUARD_KEY);
            if (!value) return false;
            if (value === "1") return true;
            var ts = Number(value);
            return isFinite(ts) && Date.now() - ts < GUARD_MS;
          } catch (error) {
            // Without storage there is no loop guard, so never start a reload.
            return true;
          }
        }

        function isAssetScript(target) {
          if (!target || target.tagName !== "SCRIPT") return false;
          var src = String(target.src || "");
          return src.indexOf("/assets/") !== -1 || /\.m?js(\?|$)/.test(src);
        }

        // A recovery that lands on a blank page is worse than the failure it was
        // recovering from, so the operator always gets something to look at and
        // -- if it strands -- something to press.
        var overlay = null;
        function paintOverlay(message, actionLabel, onAction) {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          overlay = document.createElement("div");
          overlay.setAttribute("dir", "rtl");
          overlay.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:flex;"
            + "flex-direction:column;align-items:center;justify-content:center;gap:16px;"
            + "padding:24px;text-align:center;font:500 16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;"
            + "background:var(--bg,#eae7e0);color:var(--text,#1b1915)";
          var text = document.createElement("div");
          text.textContent = message;
          text.style.cssText = "max-width:28rem";
          overlay.appendChild(text);
          if (actionLabel) {
            var button = document.createElement("button");
            button.type = "button";
            button.textContent = actionLabel;
            button.style.cssText = "cursor:pointer;border:1px solid var(--border,#ded8cb);border-radius:12px;"
              + "padding:10px 24px;font:inherit;background:var(--surface,#fff);color:inherit";
            button.addEventListener("click", onAction);
            overlay.appendChild(button);
          }
          (document.body || document.documentElement).appendChild(overlay);
        }

        // Reloading while the new deployment is still propagating is what turns a
        // single blank flash into a page that never comes back: the fresh load
        // fails too, and the guard below then blocks any further attempt. So
        // confirm the CDN is serving a bootable document BEFORE handing the tab
        // over to it.
        function freshBuildReady() {
          return fetch("/index.html", { cache: "no-store", credentials: "omit" })
            .then(function (response) { return response.ok ? response.text() : ""; })
            .then(function (html) {
              var match = html.match(/<script[^>]+type="module"[^>]+src="(\/assets\/[^"]+)"/);
              if (!match) return false;
              // HEAD, so the probe costs headers rather than the whole entry bundle.
              return fetch(match[1], { method: "HEAD", cache: "no-store", credentials: "omit" }).then(function (response) {
                var type = String(response.headers.get("content-type") || "").toLowerCase();
                // The SPA rewrite serves index.html for anything it cannot find,
                // so a 200 alone proves nothing -- the MIME type is the real test.
                return response.ok && type.indexOf("javascript") !== -1;
              });
            })
            .catch(function () { return false; });
        }

        function recover(force) {
          try {
            sessionStorage.setItem(GUARD_KEY, String(Date.now()));
          } catch (error) {
            if (!force) return;
          }
          recovering = true;
          paintOverlay("جارٍ تحديث نسخة النظام…", null, null);

          var settled = false;
          function finish() {
            if (settled) return;
            settled = true;
            var url = new URL(window.location.href);
            url.searchParams.set("__m1_reload", String(Date.now()));
            window.location.replace(url.toString());
          }

          var jobs = [];
          try {
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              }));
            }
          } catch (error) { /* cache storage can be blocked */ }
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (error) { /* service workers can be unavailable */ }

          // Wait for the deployment to become bootable, but never indefinitely --
          // reloading blind still beats sitting on a dead page.
          var waits = [0, 1500, 4000];
          function attempt(index) {
            if (settled) return;
            if (index >= waits.length) return finish();
            setTimeout(function () {
              if (settled) return;
              freshBuildReady().then(function (ready) {
                if (ready) return finish();
                attempt(index + 1);
              }, function () { attempt(index + 1); });
            }, waits[index]);
          }

          Promise.all(jobs).then(function () { attempt(0); }, function () { attempt(0); });
          setTimeout(finish, 12000); // never let the probe stall the recovery
        }

        // Script load failures do not bubble, so listen in the capture phase.
        window.addEventListener("error", function (event) {
          if (alreadyAttempted()) return;
          if (isAssetScript(event && event.target)) recover(false);
        }, true);

        // Release the guard once the app has clearly booted, so a genuine future
        // stale-build event is still recoverable in this same tab.
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) {
              try { sessionStorage.removeItem(GUARD_KEY); } catch (error) { /* ignore */ }
              return;
            }
            if (recovering) return; // a recovery already owns the screen
            // Nothing mounted and nothing is recovering: either the guard blocked
            // a second attempt or storage is unavailable. Both used to leave a
            // silent blank page with no way out but a manual hard reload.
            paintOverlay(
              "النظام مقدرش يفتح النسخة الحالية. اضغط تحديث لتحميل آخر نسخة.",
              "تحديث الآن",
              function () {
                try { sessionStorage.removeItem(GUARD_KEY); } catch (error) { /* ignore */ }
                recover(true);
              }
            );
          }, 12000);
        });

        // Deployment diagnostics. Defined here rather than in the app bundle so
        // it still answers on a page that failed to boot -- which is precisely
        // when someone needs it. Reports only build/cache identity, never
        // credentials, tokens or business data.
        window.__m1Diagnostics = function () {
          var entry = "";
          var scripts = document.querySelectorAll('script[type="module"][src]');
          for (var i = 0; i < scripts.length; i += 1) {
            if (scripts[i].src.indexOf("/assets/") !== -1) { entry = scripts[i].src; break; }
          }
          // Vite stamps the deployed commit into every asset filename.
          var build = (entry.match(/-([0-9a-f]{7,12})\.js$/) || [])[1] || null;
          var result = {
            build: build,
            entry: entry.split("/").pop() || null,
            rootMounted: !!(document.getElementById("root") || {}).childElementCount,
            recoveryGuard: (function () {
              try { return sessionStorage.getItem(GUARD_KEY); } catch (error) { return "unavailable"; }
            })(),
            controller: (navigator.serviceWorker && navigator.serviceWorker.controller
              && navigator.serviceWorker.controller.scriptURL) || null,
          };
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              result.serviceWorkers = regs.map(function (r) {
                return {
                  scope: r.scope,
                  active: r.active && r.active.scriptURL,
                  waiting: !!r.waiting,
                  installing: !!r.installing,
                };
              });
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (names) { result.caches = names; }));
          }
          return Promise.all(jobs).then(function () { return result; });
        };
      })();
    </script>
    <title>M1 Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
