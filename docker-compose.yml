services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: sh -c "npm run db:setup && npm run db:seed && node server/server.js"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/erp_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: ${PORT:-8000}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PGSSLMODE: disable
      # Open-weights text generation (product descriptions, SEO metadata,
      # social captions) through the Ollama service below. Set
      # AI_TEXT_PROVIDER=openai to go back to OpenAI, or =off for templates only.
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-ollama}
      AI_TEXT_BASE_URL: ${AI_TEXT_BASE_URL:-http://ollama:11434/v1}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-gemma3:4b}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-120000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./server/uploads:/app/uploads
  # Local LLM runtime: open-weights models, no subscription. CPU inference on a
  # 6-core box answers a product description in roughly 20-60 s with a 4B model,
  # so one request at a time and keep the model warm between edits.
  ollama:
    image: ollama/ollama:latest
    container_name: erp-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  ollama_models:


