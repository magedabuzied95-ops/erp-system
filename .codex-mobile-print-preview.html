<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Print Barcode</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #0f172a;
    }
    .preview-shell { min-height: 100vh; display: flex; flex-direction: column; background: #0f172a; }
    .preview-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(env(safe-area-inset-top) + 12px) 12px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(15, 23, 42, 0.96);
      color: #f8fafc;
      backdrop-filter: blur(18px);
    }
    .preview-toolbar-title { min-width: 0; flex: 1; text-align: center; font-size: 15px; font-weight: 900; letter-spacing: 0.02em; }
    .preview-toolbar-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .preview-toolbar-button.primary { background: linear-gradient(180deg, #16a34a, #15803d); border-color: rgba(22, 163, 74, 0.35); }
    .page {
      padding: 16px;
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .sheet {
      background: #fff;
      width: 50mm;
      min-height: 30mm;
      padding: 1mm;
      border-radius: 10px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
    }
    .label {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      overflow: hidden;
      background: #fff;
    }
    .title { margin: 0; font-size: 13px; line-height: 1.2; font-weight: 900; color: #111827; }
    .meta { margin-top: 6px; font-size: 10px; line-height: 1.35; color: #334155; font-weight: 700; }
    .barcode { margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 10px 4px; background: #fff; }
    .barcode svg { display: block; width: 100%; height: auto; }
    @media print {
      body { background: #fff; }
      .preview-toolbar { display: none !important; }
      .preview-shell { min-height: 0; display: block; background: #fff; }
      .page { padding: 0; margin: 0; background: #fff; display: block; min-height: 0; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="preview-shell">
    <div class="preview-toolbar" role="banner" aria-label="Print Barcode">
      <button class="preview-toolbar-button">Back / Close</button>
      <div class="preview-toolbar-title">Print Barcode</div>
      <button class="preview-toolbar-button primary">Print</button>
    </div>
    <div class="page">
      <div class="sheet">
        <div class="label">
          <h1 class="title">Demo Shoe</h1>
          <div class="meta">Size 42 · Black</div>
          <div class="meta">SKU-42</div>
          <div class="barcode">
            <svg viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="barcode">
              <rect width="240" height="70" fill="#ffffff"/>
              <rect x="12" y="8" width="4" height="44" fill="#111827"/>
              <rect x="20" y="8" width="2" height="44" fill="#111827"/>
              <rect x="26" y="8" width="7" height="44" fill="#111827"/>
              <rect x="38" y="8" width="3" height="44" fill="#111827"/>
              <rect x="46" y="8" width="5" height="44" fill="#111827"/>
              <rect x="55" y="8" width="2" height="44" fill="#111827"/>
              <rect x="62" y="8" width="8" height="44" fill="#111827"/>
              <rect x="74" y="8" width="3" height="44" fill="#111827"/>
              <rect x="82" y="8" width="2" height="44" fill="#111827"/>
              <rect x="90" y="8" width="6" height="44" fill="#111827"/>
              <rect x="101" y="8" width="3" height="44" fill="#111827"/>
              <rect x="109" y="8" width="7" height="44" fill="#111827"/>
              <rect x="121" y="8" width="2" height="44" fill="#111827"/>
              <rect x="128" y="8" width="6" height="44" fill="#111827"/>
              <rect x="139" y="8" width="3" height="44" fill="#111827"/>
              <rect x="147" y="8" width="8" height="44" fill="#111827"/>
              <rect x="159" y="8" width="2" height="44" fill="#111827"/>
              <rect x="166" y="8" width="5" height="44" fill="#111827"/>
              <rect x="176" y="8" width="3" height="44" fill="#111827"/>
              <rect x="184" y="8" width="6" height="44" fill="#111827"/>
              <rect x="195" y="8" width="2" height="44" fill="#111827"/>
              <rect x="202" y="8" width="7" height="44" fill="#111827"/>
              <rect x="214" y="8" width="4" height="44" fill="#111827"/>
              <rect x="222" y="8" width="5" height="44" fill="#111827"/>
              <text x="120" y="64" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="12" font-weight="700">123456789012</text>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
