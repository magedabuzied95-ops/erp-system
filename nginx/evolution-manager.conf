# HTTPS entrance for the Evolution WhatsApp gateway (manager UI + API).
#
# Why this file exists: the shop's ISP intercepts plain HTTP on EVERY port and
# answers with its own redirection page, so http://<host>:8080/manager never
# reaches the gateway from the shop network. TLS traffic is untouched.
#
# Why a dedicated port instead of a path on api.m1store-egy.com: the manager is
# a SPA that loads its assets from absolute /assets/... URLs, so it only works
# when it is served at the ROOT of whatever origin it is reached through.
#
# Install on the server (13.140.141.50):
#   scp nginx/evolution-manager.conf \
#       root@13.140.141.50:/etc/nginx/sites-available/evolution-manager
#   ssh root@13.140.141.50 'ln -sf /etc/nginx/sites-available/evolution-manager \
#       /etc/nginx/sites-enabled/evolution-manager && nginx -t && systemctl reload nginx'
#   ssh root@13.140.141.50 'ufw allow 8443/tcp'
# Then open https://api.m1store-egy.com:8443/manager
#
# Depends on the $connection_upgrade map in /etc/nginx/conf.d/websocket_upgrade.conf.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name api.m1store-egy.com;

    ssl_certificate /etc/letsencrypt/live/api.m1store-egy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.m1store-egy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
