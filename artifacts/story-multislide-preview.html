<!doctype html>

    <style>

        padding: 28px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }

        margin: 0 0 22px;
        color: #94a3b8;
        font-size: 14px;
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
      }
      figure {
        margin: 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 9 / 16;
        object-fit: cover;
        background: #020617;
      }
      figcaption {
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
